<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Whiteboard Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <h2>🧠 AI Whiteboard Pro</h2>

  <div>
    <button id="zoomOut">➖</button>
    <button id="zoomIn">➕</button>

    <input type="color" id="colorPicker" value="#000000">

    <input
      type="range"
      id="sizeSlider"
      min="1"
      max="50"
      value="4"
    >
  </div>
</div>

<div id="sidebar">

  <button class="tool" id="penBtn">✏️</button>

  <button class="tool" id="eraserBtn">🧽</button>

  <button class="tool" id="stickyBtn">📌</button>

  <button class="tool" id="textBtn">📝</button>

  <button class="tool" id="uploadBtn">🖼️</button>

</div>

<div id="boardArea">

  <canvas id="board"></canvas>

  <input
    type="file"
    id="imageUpload"
    accept="image/*"
    hidden
  >

</div>

<script src="script.js"></script>

</body>
</html>
